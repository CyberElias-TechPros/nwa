name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack enable && pnpm install --frozen-lockfile=false
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Android is NOT built here until gradlew wrapper + JDK toolchain is added in W12.
      # - name: Android assembleDebug
      #   working-directory: apps/android
      #   run: ./gradlew assembleDebug lintDebug
